[project]
name = "mlr570-survey"
version = "0.1.0"
description = "MLR570 survey: state-of-the-art knowledge distillation for image classification, 2022-2026"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
